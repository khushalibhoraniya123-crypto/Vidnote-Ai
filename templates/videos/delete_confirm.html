{% extends 'base.html' %}

{% block title %}Delete Video | VidNote AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white text-center">
                <div class="bg-danger bg-opacity-10 text-danger d-inline-flex align-items-center justify-content-center rounded-circle mx-auto mb-3" style="width: 64px; height: 64px;">
                    <i class="bi bi-exclamation-triangle-fill fs-2"></i>
                </div>
                
                <h3 class="fw-bold mb-2">Delete Video?</h3>
                <p class="text-muted mb-4">
                    Are you sure you want to delete <strong class="text-dark">"{{ video.title }}"</strong>? This action cannot be undone and will remove the video file and all associated data.
                </p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'videos:detail' video.pk %}" class="btn btn-outline-secondary rounded-pill px-4">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-danger rounded-pill px-4 fw-semibold shadow-sm">
                            <i class="bi bi-trash-fill me-1"></i> Yes, Delete
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
